<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Journal</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* === Base Styles & Variables === */
        :root {
            /* Light Theme */
            --bg-color: #f8f9fa;
            --text-color: #212529;
            --accent-color: #6c757d;
            --card-bg: #ffffff;
            --border-color: #dee2e6;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            --transition: all 0.3s ease;
        }

        /* Dark Theme */
        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #e9ecef;
            --accent-color: #adb5bd;
            --card-bg: #1e1e1e;
            --border-color: #333;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: var(--transition);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 1rem;
            min-height: 100vh;
        }

        /* === Layout === */
        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* === Header === */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .theme-toggle {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            font-size: 1.2rem;
        }

        /* === Journal Form === */
        .journal-form {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        input, textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: inherit;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        button {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }

        button:hover {
            opacity: 0.9;
        }

        /* === Journal Entries === */
        .entries {
            display: grid;
            gap: 1.5rem;
        }

        .entry {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: var(--shadow);
        }

        .entry-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .entry-title {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .entry-date {
            color: var(--accent-color);
            font-size: 0.9rem;
        }

        .entry-content {
            margin-bottom: 1rem;
        }

        .entry-actions {
            display: flex;
            gap: 0.5rem;
        }

        .entry-actions button {
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
        }

        .delete-btn {
            background: #dc3545;
        }

        /* === Markdown Styling === */
        .entry-content pre {
            background: var(--bg-color);
            padding: 1rem;
            border-radius: 4px;
            overflow-x: auto;
        }

        .entry-content code {
            font-family: 'Courier New', monospace;
            background: var(--bg-color);
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
        }

        .entry-content blockquote {
            border-left: 3px solid var(--accent-color);
            padding-left: 1rem;
            margin: 1rem 0;
            color: var(--accent-color);
        }

        /* === Responsive === */
        @media (max-width: 600px) {
            .entry-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1 class="logo">My Journal</h1>
            <button class="theme-toggle" aria-label="Toggle theme">🌓</button>
        </header>

        <!-- Journal Form -->
        <form id="journalForm" class="journal-form">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" required>
            </div>
            <div class="form-group">
                <label for="content">Content (Markdown supported)</label>
                <textarea id="content" required></textarea>
            </div>
            <button type="submit">Save Entry</button>
        </form>

        <!-- Journal Entries -->
        <div class="entries" id="entriesContainer">
            <!-- Entries will be loaded here -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const journalForm = document.getElementById('journalForm');
            const entriesContainer = document.getElementById('entriesContainer');
            const themeToggle = document.querySelector('.theme-toggle');
            
            // Initialize with saved theme or system preference
            const savedTheme = localStorage.getItem('theme') || 
                              (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            
            if (savedTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeToggle.textContent = '🌞';
            }
            
            // Load saved entries
            loadEntries();
            
            // Theme toggle
            themeToggle.addEventListener('click', function() {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                
                if (currentTheme === 'dark') {
                    document.documentElement.removeAttribute('data-theme');
                    localStorage.setItem('theme', 'light');
                    themeToggle.textContent = '🌓';
                } else {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    localStorage.setItem('theme', 'dark');
                    themeToggle.textContent = '🌞';
                }
            });
            
            // Form submission
            journalForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const title = document.getElementById('title').value;
                const content = document.getElementById('content').value;
                
                saveEntry(title, content);
                journalForm.reset();
            });
            
            // Save entry to localStorage
            function saveEntry(title, content) {
                const entries = JSON.parse(localStorage.getItem('journalEntries') || '[]');
                const newEntry = {
                    id: Date.now(),
                    title,
                    content,
                    date: new Date().toLocaleDateString('en-US', { 
                        year: 'numeric', 
                        month: 'long', 
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    })
                };
                
                entries.unshift(newEntry); // Add to beginning of array
                localStorage.setItem('journalEntries', JSON.stringify(entries));
                loadEntries();
            }
            
            // Load entries from localStorage
            function loadEntries() {
                const entries = JSON.parse(localStorage.getItem('journalEntries') || '[]');
                entriesContainer.innerHTML = '';
                
                if (entries.length === 0) {
                    entriesContainer.innerHTML = '<p>No entries yet. Write your first journal entry!</p>';
                    return;
                }
                
                entries.forEach(entry => {
                    const entryElement = document.createElement('div');
                    entryElement.className = 'entry';
                    entryElement.innerHTML = `
                        <div class="entry-header">
                            <h3 class="entry-title">${entry.title}</h3>
                            <span class="entry-date">${entry.date}</span>
                        </div>
                        <div class="entry-content">${marked.parse(entry.content)}</div>
                        <div class="entry-actions">
                            <button class="delete-btn" data-id="${entry.id}">Delete</button>
                        </div>
                    `;
                    
                    entriesContainer.appendChild(entryElement);
                });
                
                // Add delete event listeners
                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        deleteEntry(parseInt(this.dataset.id));
                    });
                });
            }
            
            // Delete entry
            function deleteEntry(id) {
                if (confirm('Are you sure you want to delete this entry?')) {
                    const entries = JSON.parse(localStorage.getItem('journalEntries') || '[]');
                    const filteredEntries = entries.filter(entry => entry.id !== id);
                    localStorage.setItem('journalEntries', JSON.stringify(filteredEntries));
                    loadEntries();
                }
            }
        });
    </script>
</body>
</html>
